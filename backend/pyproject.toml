# Note: app/skills/*.py are skill *source*, hashed into each registered
# version. Editing one (including `ruff --fix`) means bumping its version
# and re-running `make seed`.
[tool.ruff]
line-length = 140
target-version = "py312"
extend-exclude = ["migrations/versions", ".venv"]

[tool.ruff.lint]
# Pyflakes, pycodestyle errors, import order, bugbear, and pyupgrade.
select = ["F", "E", "I", "B", "UP"]
ignore = [
  "E501",  # long lines are left to review; the formatter is not enforced yet
  "B008",  # FastAPI uses function calls (Depends, Query) in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
