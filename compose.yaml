services:
  postgres:
    image: postgres:18

    env_file:
      - .env.postgres

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - skillforge_pgdata:/var/lib/postgresql

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U skillforge -d skillforge
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  skillforge_pgdata: